# Python worker: a thin wrapper around Demucs and lyric-align that speaks
# JSON lines on stdout (see "Worker protocol" in the build plan).
# Keep it under ~300 lines. The Go app never imports anything from here.
[project]
name = "ttml-worker"
version = "0.0.0"
description = "Background worker for vocal separation and lyric alignment"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
# Heavy runtime stack (torch, faster-whisper). Not installed by default;
# `just worker-ml` adds it. Locked in uv.lock either way.
ml = [
    "demucs==4.1.0",
    "lyric-align[asr]==0.4.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

# Proof-of-concept stage: standard type checking and a common ruff rule set.
# Tighten these as the worker settles.
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff-specific
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]
